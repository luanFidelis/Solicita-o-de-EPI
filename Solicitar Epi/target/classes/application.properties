# =====================================================================
#  Microserviço de Solicitação de Material (EPI)
#
#  Por padrão sobe com H2 em memória e dados de exemplo, para o projeto
#  rodar assim que for clonado — sem instalar banco:
#
#      ./mvnw spring-boot:run     e abra http://localhost:8085
#
#  Em produção, um application.properties externo (ao lado do .jar)
#  sobrescreve estes valores e aponta para o MySQL real.
# =====================================================================
spring.application.name=Hhtec

# ---- Banco: H2 em memória ----
# As tabelas são criadas pelo Hibernate e populadas por data.sql.
spring.datasource.url=jdbc:h2:mem:solicitacao;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Console do banco: http://localhost:8085/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- JPA ----
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# data.sql precisa rodar DEPOIS do Hibernate criar as tabelas.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

server.port=8085

# ---- E-mail ----
# Desligado na demonstração: sem isto, cada pedido tentaria conectar num
# servidor SMTP que não existe e o log encheria de erro.
hhtec.email.ativo=false
hhtec.email.gestora=
spring.mail.host=localhost
spring.mail.port=25
