# =====================================================================
#  CONFIGURACAO DA API NO SERVIDOR
#  Este arquivo fica AO LADO do hhtec-api.jar e SOBRESCREVE o que veio
#  empacotado dentro dele. Mudou algo aqui? Basta reiniciar o servico,
#  nao precisa gerar o jar de novo.
# =====================================================================

spring.application.name=Hhtec

# ---- Banco: e o mesmo MySQL do XAMPP que o PHP ja usa ----
# Conferido no servidor: usuario root sem senha, banco hhtec.
spring.datasource.url=jdbc:mysql://localhost:3306/hhtec
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# NUNCA mude para update/create: o banco e do sistema PHP.
# Com "update" o Hibernate altera as tabelas dele (ja apagou DEFAULTs uma vez).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# ---- Porta da API ----
# A 80 e do Apache/XAMPP. A API fica na 8085, que e a porta que o
# proxy PHP (Materiais/api_solicitacao_epi.php) procura.
server.port=8085

# ---- E-mail (mesmo servidor que o PHPMailer do PHP usa) ----
spring.mail.host=mail.hhtec.com.br
spring.mail.port=465
spring.mail.username=sistema@hhtec.com.br
# COLOQUE A SENHA AQUI (a mesma do PHPMailer, em
# xampp/htdocs/hhtec/Materiais/solicitacoes/salvar.php).
# Deixando vazio, a API sobe normal e apenas nao envia aviso.
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=mail.hhtec.com.br
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000

# Quem recebe o aviso de pedido novo.
hhtec.email.gestora=viviani.costa@hhtec.com.br
# Coloque false para calar os avisos sem mexer em mais nada.
hhtec.email.ativo=true
